<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffaa00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
  </defs>

  <!-- Outer Orbit Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="100" cy="100" r="84" fill="#0a0f1d" stroke="#ffd166" stroke-width="1.5"/>

  <!-- Steppe Sun Rays (32 geometric rays) -->
  <circle cx="100" cy="100" r="45" fill="url(#sunGlow)"/>

  <!-- Qoshqar Müyiz (Ram Horn) Traditional Kazakh Ornament Geometry -->
  <path d="M 100 45 C 85 25, 55 35, 60 55 C 65 70, 85 70, 95 62 L 100 68 L 105 62 C 115 70, 135 70, 140 55 C 145 35, 115 25, 100 45 Z" 
        fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>

  <!-- Tulpar Eagle Wing / Spacecraft Silhouette -->
  <path d="M 100 65 L 145 125 L 115 120 L 100 155 L 85 120 L 55 125 Z" 
        fill="url(#cyberCyan)" stroke="#00f0ff" stroke-width="2"/>

  <!-- Inner Core / Planet Mars dot -->
  <circle cx="100" cy="100" r="10" fill="#ef4444" stroke="#ffd166" stroke-width="2"/>

  <!-- Star of Baikonur -->
  <polygon points="100,20 103,28 111,28 105,33 107,41 100,36 93,41 95,33 89,28 97,28" fill="#00f0ff"/>
</svg>
